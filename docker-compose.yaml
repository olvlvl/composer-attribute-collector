---
services:
  app82:
    build:
      context: .
      args:
        PHP_TAG: '8.2-cli-trixie'
    environment:
      PHP_IDE_CONFIG: 'serverName=olvlvl/attribute-collector'
    volumes:
      - .:/app:delegated
      - composer-cache:/root/.composer/cache
    working_dir: /app
  app85:
    build:
      context: .
      args:
        PHP_TAG: '8.5-cli-trixie'
        COMPOSER_TAG: latest
    environment:
      PHP_IDE_CONFIG: 'serverName=olvlvl/attribute-collector'
    volumes:
      - .:/app:delegated
      - composer-cache:/root/.composer/cache
    working_dir: /app

volumes:
  composer-cache:
